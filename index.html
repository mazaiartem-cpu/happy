<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Привітання для тата</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0044a7, #0099ff);
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
        }

        .container {
            margin-top: 120px;
        }

        h1 {
            font-size: 48px;
            text-shadow: 2px 2px 10px black;
        }

        p {
            font-size: 22px;
            max-width: 700px;
            margin: auto;
            line-height: 1.5;
            text-shadow: 1px 1px 5px black;
        }

        .popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            visibility: hidden;
        }

        .popup-box {
            background: white;
            color: black;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            width: 300px;
            animation: fadeIn 0.6s ease;
        }

        .popup-box h2 {
            margin-top: 0;
            color: #0044a7;
        }

        .close-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background: #0044a7;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: scale(0.7);}
            to {opacity: 1; transform: scale(1);}
        }
    </style>
</head>
<body>

<div class="popup" id="popup">
    <div class="popup-box">
        <h2>З Днем народження, тато!</h2>
        <p>Бажаю міцного здоров'я, сили, миру та Божого захисту! Ми дуже тебе любимо ❤️</p>
        <button class="close-btn" onclick="closePopup()">Дякую</button>
    </div>
</div>

<div class="container">
    <h1>З Днем народження, тато!</h1>
    <p>
        Ти — наша гордість, наша сила і наша підтримка.  
        Бажаємо тобі здоров’я, щастя, удачі та нехай Господь оберігає тебе щодня.  
        Дякуємо за твою мужність і службу Україні 💙💛
    </p>
</div>

<script>
    window.onload = function() {
        document.getElementById("popup").style.visibility = "visible";
    };

    function closePopup() {
        document.getElementById("popup").style.visibility = "hidden";
    }
</script>

</body>
</html>
